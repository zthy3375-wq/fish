<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邯院通 · 使用统计</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f5f7fc;color:#233347;margin:0;padding:24px}main{max-width:900px;margin:auto}h1{font-size:26px}p,small{color:#68778a;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,section{background:white;border:1px solid #e3e8ef;border-radius:16px;padding:20px;margin:14px 0}.card{margin:0}.number{display:block;font-size:32px;font-weight:650;margin-top:10px}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #cdd7e5}button{background:#3158ba;color:white;cursor:pointer}input{width:100%;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #edf0f4}[hidden]{display:none!important}.actions{display:flex;gap:12px}#error{color:#a22929}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}</style><main><h1>邯院通 · 使用统计</h1><p>统计同意参与的活跃安装。同一安装去重；重装或清除数据可能产生新的安装标识，数字不等于精确人数。</p><section id="login"><form id="form"><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password" required><button>查看统计</button></form></section><p id="error" role="alert"></p><div id="report" hidden><div class="actions"><button id="refresh">刷新</button><button id="logout">退出</button></div><p id="updated"></p><div class="grid" id="totals"></div><section><h2>近 30 天活跃</h2><table><thead><tr><th>日期</th><th>活跃安装</th></tr></thead><tbody id="trend"></tbody></table></section><section><h2>近 30 天版本分布</h2><table><thead><tr><th>版本</th><th>安装数</th></tr></thead><tbody id="versions"></tbody></table></section></div></main><script>
let token='';const $=id=>document.getElementById(id);async function refresh(){ $('error').textContent='';try{const r=await fetch(location.pathname.replace(/\/dashboard\/?$/,'/stats'),{headers:{'X-Hyt-Token':token},cache:'no-store'});if(!r.ok)throw Error(r.status===403?'管理密码不正确':'统计暂时无法读取，请稍后重试');const data=await r.json();$('login').hidden=true;$('report').hidden=false;$('updated').textContent='更新时间：'+new Date(data.generatedAt).toLocaleString('zh-CN')+'（每小时汇总）'+(data.stale?' · 汇总延迟':'');$('totals').replaceChildren();for(const [key,label]of [['total','累计活跃安装'],['today','今日活跃'],['newToday','今日新增'],['weekly','近七天活跃']]){const div=document.createElement('div');div.className='card';div.textContent=label;const strong=document.createElement('strong');strong.className='number';strong.textContent=data.totals[key]??'待汇总';div.append(strong);$('totals').append(div)}for(const [id,rows,keys]of [['trend',data.trend,['day','active']],['versions',data.versions,['version','count']]]){$(id).replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const key of keys){const td=document.createElement('td');td.textContent=String(row[key]);tr.append(td)}$(id).append(tr)}}}catch(e){$('error').textContent=e.message}}
$('form').onsubmit=e=>{e.preventDefault();token=$('password').value;$('password').value='';refresh()};$('refresh').onclick=refresh;$('logout').onclick=()=>{token='';$('login').hidden=false;$('report').hidden=true;$('totals').replaceChildren();$('trend').replaceChildren();$('versions').replaceChildren()};
</script></html>
