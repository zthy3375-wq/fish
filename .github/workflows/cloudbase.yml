name: CloudBase analytics deployment
on:
  workflow_dispatch:
  push:
    branches: [ops/retire-analytics-20261118]
    paths: ['.github/workflows/cloudbase.yml', 'scripts/cloudbase/deploy-analytics.mjs', 'scripts/cloudbase/retire-analytics-timer.py', 'cloudbase/functions/analytics/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test analytics contracts
        run: node --test cloudbase/tests/analytics.verify.mjs
      - run: python3 -m pip install --disable-pip-version-check tencentcloud-sdk-python-scf
      - name: Retire and verify analytics
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_ENV_ID: hanyuantong-d8gjzt1jh12370215
          TCB_SITE: domestic
          CI: 'true'
        run: node scripts/cloudbase/deploy-analytics.mjs
