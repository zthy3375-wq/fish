name: Verify analytics timer
on:
  push:
    branches: [fix/analytics-hourly]
    paths: ['.github/workflows/verify-analytics-hourly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Manual SCF Invoke is not granted to the deployment credential.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @cloudbase/cli@3.9.1 --ignore-scripts
      - name: Verify live timer after service cutover
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          TCB_SITE: domestic
          CI: 'true'
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const env='hanyuantong-d8gjzt1jh12370215',key=process.env.CLOUDBASE_API_KEY;
          const origin='https://hanyuantong-d8gjzt1jh12370215-1527874185.ap-shanghai.app.tcloudbase.com';
          let ready=false;
          for(let i=0;i<40;i++){
            try{const r=await fetch(origin+'/hyt-analytics/health',{signal:AbortSignal.timeout(10000)});const b=await r.json();if(r.ok&&b.revision==='hourly-v2'){ready=true;break}}catch{}
            await new Promise(r=>setTimeout(r,15000));
          }
          if(!ready)throw Error('Production cutover not ready');
          const r=await fetch(`https://${env}.ap-shanghai.tcb-api.tencentcloudapi.com/capi/credential`,{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify({env}),signal:AbortSignal.timeout(10000)});
          const data=await r.json();if(data.code!==0)throw Error('Credential exchange failed');const c=data.data;
          const childEnv={...process.env,CLOUDBASE_API_KEY:'',TENCENTCLOUD_SECRETID:c.TmpSecretId,TENCENTCLOUD_SECRETKEY:c.TmpSecretKey,TENCENTCLOUD_SESSIONTOKEN:c.Token};
          const result=spawnSync('tcb',['fn','invoke','hyt-analytics-hourly','-e',env,'-r','ap-shanghai','--json'],{env:childEnv,encoding:'utf8',timeout:300000});
          const redacted=[key,c.TmpSecretKey,c.TmpSecretId,c.Token].reduce((v,k)=>v.replaceAll(k,'[redacted]'),(result.stdout||'')+(result.stderr||''));
          console.log(redacted);if(result.status!==0)throw Error('Timer invocation failed');
          JS
