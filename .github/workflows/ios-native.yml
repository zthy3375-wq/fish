name: Native iOS verification
on:
  pull_request:
    paths: ['ios-native/**', 'android/app/src/main/assets/handan-*.js', '.github/workflows/ios-native.yml']
  push:
    branches: ['feature/ios-native-*']
    paths: ['ios-native/**', 'android/app/src/main/assets/handan-*.js', '.github/workflows/ios-native.yml']
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-ios:
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Verify project and identical school query assets
        id: verify
        run: |
          python3 ios-native/Scripts/generate_project.py
          git diff --exit-code -- ios-native/Hanyuantong.xcodeproj
          cmp android/app/src/main/assets/handan-academic.js ios-native/Hanyuantong/Resources/handan-academic.js
          cmp android/app/src/main/assets/handan-rendered-reader.js ios-native/Hanyuantong/Resources/handan-rendered-reader.js
      - name: Enforce iOS 15.4 API availability on physical-device target
        id: device_build
        timeout-minutes: 18
        run: |
          set -o pipefail
          xcodebuild -project ios-native/Hanyuantong.xcodeproj -scheme Hanyuantong -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-compat-device" CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=15.4 build | tee "$RUNNER_TEMP/ios15-availability.log"
          python3 - <<'PYTHON'
          import os, plistlib
          from pathlib import Path
          app = Path(os.environ['RUNNER_TEMP']) / 'ios-compat-device/Build/Products/Release-iphoneos/Hanyuantong.app'
          for bundle in [app, *app.glob('PlugIns/*.appex')]:
              with (bundle / 'Info.plist').open('rb') as f: info = plistlib.load(f)
              assert info['MinimumOSVersion'] == '15.4', (bundle.name, info['MinimumOSVersion'])
          PYTHON
      - name: Package unsigned device app
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$RUNNER_TEMP/ios-compat-device/Build/Products/Release-iphoneos/Hanyuantong.app" "$RUNNER_TEMP/package/Payload/Hanyuantong.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --keepParent Payload "$RUNNER_TEMP/Hanyuantong-iOS-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-device-app
          path: ${{ runner.temp }}/Hanyuantong-iOS-unsigned.ipa
          retention-days: 14
      - name: Select SDK-matched iPhone simulator
        timeout-minutes: 5
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'devices.json').read_text())['devices']
          sdk = tuple(map(int, subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True).strip().split('.')[:2]))
          candidates = []
          for runtime, rows in devices.items():
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              if not match:
                  continue
              version = tuple(map(int, match.groups()))
              if not (15, 4) <= version <= sdk:
                  continue
              for device in rows:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      candidates.append((version, device['name'], device['udid']))
          if not candidates:
              raise SystemExit(f'No available iPhone runtime at or below selected SDK {sdk}')
          version = max(c[0] for c in candidates)
          models = [c for c in candidates if c[0] == version]
          _, name, device = max(models, key=lambda c: ("Pro Max" in c[1], c[1]))
          runtime_id = next(key for key in devices if key.endswith(f'iOS-{version[0]}-{version[1]}'))
          phone13 = next((c for c in models if c[1] == 'iPhone 13'), None)
          second = phone13[2] if phone13 else subprocess.check_output([
              'xcrun', 'simctl', 'create', 'Parity iPhone 13',
              'com.apple.CoreSimulator.SimDeviceType.iPhone-13', runtime_id], text=True).strip()
          print(f'Primary {name}, second iPhone 13, installed runtime {runtime_id}; iOS 15.4 runtime installed: {any("iOS-15-4" in k for k in devices)}')
          # WebKit bug 293831 affects <=18.3 deployment targets on 18.4/18.5 simulators.
          # Official workaround applies to this simulator test build only; device build remains iOS15.4.
          deployment = '18.4' if (18, 4) <= version < (18, 6) else '15.4'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'DEVICE={device}\nSECOND_DEVICE={second}\nTEST_DEPLOYMENT={deployment}\n')
          print(f'Selected SDK {sdk}; test runtime iOS {version}; simulator-only deployment target {deployment}')
          PYTHON
      - name: Compile simulator app and tests before boot
        timeout-minutes: 14
        run: |
          set -o pipefail
          xcodebuild -project ios-native/Hanyuantong.xcodeproj -scheme Hanyuantong -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- IPHONEOS_DEPLOYMENT_TARGET="$TEST_DEPLOYMENT" build-for-testing | tee "$RUNNER_TEMP/ios-compile.log"
      - name: Boot selected iPhone simulator
        id: boot
        timeout-minutes: 5
        run: |
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native unit regression
        timeout-minutes: 20
        run: |
          set -o pipefail
          node ios-native/Scripts/acceptance_community.mjs > "$RUNNER_TEMP/local-community.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18642/ready 2>/dev/null; then ready=true; break; fi
            if ! kill -0 "$service_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/local-community.log"; exit 1; fi
          # Keep the app-hosted unit bundle separate from UI tests: installing both
          # in one test invocation can race the simulator app launch (run 43612196671).
          xcodebuild -project ios-native/Hanyuantong.xcodeproj -scheme Hanyuantong -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/ios-build" -resultBundlePath "$RUNNER_TEMP/NativeUnits.xcresult" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- IPHONEOS_DEPLOYMENT_TARGET="$TEST_DEPLOYMENT" -parallel-testing-enabled NO -only-testing:HanyuantongTests test-without-building | tee "$RUNNER_TEMP/native-unit-tests.log"
      - name: Focused task UI regression
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        timeout-minutes: 18
        run: |
          set -o pipefail
          xcodebuild -project ios-native/Hanyuantong.xcodeproj -scheme Hanyuantong -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/ios-build" -resultBundlePath "$RUNNER_TEMP/FocusedTasks.xcresult" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- IPHONEOS_DEPLOYMENT_TARGET="$TEST_DEPLOYMENT" -parallel-testing-enabled NO -only-testing:HanyuantongUITests/NativeSmokeTests/testPersonalTaskPersistsAndCompletes -only-testing:HanyuantongUITests/NativeSmokeTests/testPersonalTaskEditSaveDiscardAndRelaunch test-without-building | tee "$RUNNER_TEMP/focused-task-tests.log"
      - name: Remaining UI regression
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        timeout-minutes: 18
        run: |
          set -o pipefail
          # The two task flows already passed above against these exact build products.
          # Unit tests ran in their own invocation; exercise every other UI flow once.
          xcodebuild -project ios-native/Hanyuantong.xcodeproj -scheme Hanyuantong -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/ios-build" -resultBundlePath "$RUNNER_TEMP/NativeIOS.xcresult" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- IPHONEOS_DEPLOYMENT_TARGET="$TEST_DEPLOYMENT" -parallel-testing-enabled NO -only-testing:HanyuantongUITests -skip-testing:HanyuantongUITests/NativeSmokeTests/testPersonalTaskPersistsAndCompletes -skip-testing:HanyuantongUITests/NativeSmokeTests/testPersonalTaskEditSaveDiscardAndRelaunch test-without-building | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Check five tabs and quick entry on iPhone 13
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          set -o pipefail
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl boot "$SECOND_DEVICE" || true
          xcrun simctl bootstatus "$SECOND_DEVICE" -b
          xcodebuild -project ios-native/Hanyuantong.xcodeproj -scheme Hanyuantong -destination "platform=iOS Simulator,id=$SECOND_DEVICE" -derivedDataPath "$RUNNER_TEMP/ios-build" -resultBundlePath "$RUNNER_TEMP/Second.xcresult" IPHONEOS_DEPLOYMENT_TARGET="$TEST_DEPLOYMENT" -parallel-testing-enabled NO -only-testing:HanyuantongUITests/HonorParityUITests test-without-building
      - name: Package simulator app
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: ditto -c -k --keepParent "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/Hanyuantong.app" "$RUNNER_TEMP/Hanyuantong-iOS-Simulator.zip"
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/NativeUnits.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/NativeUnits.xcresult" --output-path "$RUNNER_TEMP/unit-screenshots"
          fi
          if [ -d "$RUNNER_TEMP/FocusedTasks.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/FocusedTasks.xcresult" --output-path "$RUNNER_TEMP/task-screenshots"
          fi
          if [ -d "$RUNNER_TEMP/NativeIOS.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/NativeIOS.xcresult" --output-path "$RUNNER_TEMP/screenshots"
          fi
          if [ -d "$RUNNER_TEMP/Second.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Second.xcresult" --output-path "$RUNNER_TEMP/second-size"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/second-size
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-verification
          path: |
            ${{ runner.temp }}/ios15-availability.log
            ${{ runner.temp }}/ios-compile.log
            ${{ runner.temp }}/NativeUnits.xcresult
            ${{ runner.temp }}/native-unit-tests.log
            ${{ runner.temp }}/local-community.log
            ${{ runner.temp }}/unit-screenshots
            ${{ runner.temp }}/FocusedTasks.xcresult
            ${{ runner.temp }}/focused-task-tests.log
            ${{ runner.temp }}/task-screenshots
            ${{ runner.temp }}/NativeIOS.xcresult
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/Hanyuantong-iOS-Simulator.zip
          retention-days: 14
  android-reference:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 318a815da0041cf628e0c05fdcdd27d91fa88869
          path: android-product
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci && node ios-native/Scripts/sync_medals.mjs --check
      - name: Download verified 1.3.0 (184) APK or rebuild from the pinned source
        id: reference
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: 44356973472
          name: handan-campus-regular-debug-318a815da0041cf628e0c05fdcdd27d91fa88869
          path: reference-apk
      - if: steps.reference.outcome != 'success'
        run: |
          cd android-product
          npm ci && npm run build && npx cap sync android
          cd android && bash gradlew assembleDebug
          mkdir -p ../../reference-apk && cp app/build/outputs/apk/debug/app-debug.apk ../../reference-apk/reference.apk
      - name: Enable KVM for the reference emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            adb install "$(find reference-apk -name '*.apk' -print -quit)"
            python3 ios-native/Scripts/android_reference.py "$RUNNER_TEMP/android-reference"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reference-screenshots
          path: ${{ runner.temp }}/android-reference
          retention-days: 14
