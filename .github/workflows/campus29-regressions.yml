name: Campus and community regression on the test.29 build
on:
  push:
    branches: [ops/campus-eggs-upgrade-test29]
    paths: ['.github/workflows/campus29-regressions.yml','scripts/treehole-browser-check.mjs']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm ci --prefix cloudbase/functions/community --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium && npm run build
      - run: node scripts/academic-browser-check.mjs
      - run: node scripts/admin-browser-check.mjs && node scripts/treehole-browser-check.mjs && node scripts/community-messages-browser-check.mjs
      - run: node scripts/treehole-preview.mjs /tmp/community-review-preview.html && node scripts/treehole-preview-check.mjs /tmp/community-review-preview.html && node scripts/treehole-touch-check.mjs /tmp/community-review-preview.html
