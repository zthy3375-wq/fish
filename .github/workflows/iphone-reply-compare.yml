name: Reproduce TestFlight navigation on iPhone
on:
  push:
    branches: [qa/iphone-reply-comparison-20261123]
permissions:
  contents: read
jobs:
  bind:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            os: 26
            variant: baseline
          - runner: macos-26
            os: 26
            variant: single-editor
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select the comparison
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ "$VARIANT" == baseline ]]; then
            git show HEAD^:ios-native/Hanyuantong/Views/TreeholeView.swift > ios-native/Hanyuantong/Views/TreeholeView.swift
          else
            git show HEAD^:ios-native/UITests/HonorParityUITests.swift > ios-native/UITests/HonorParityUITests.swift
          fi
      - name: Test cold launch, navigation, community and services on the device-sized stack
        env:
          TARGET_IOS: ${{ matrix.os }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ $TARGET_IOS == 18 ]]; then
            target=$(ls -d /Applications/Xcode_26*.app | head -1)
            export DEVELOPER_DIR="$target/Contents/Developer"
          fi
          device=$(xcrun simctl list devices available -j | python3 -c 'import os,json,sys; print(next(d["udid"] for k,ds in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if ("iOS-"+os.environ["TARGET_IOS"]+"-") in k for d in ds if "iPhone" in d["name"]))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl spawn "$device" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          args=(-project ios-native/Hanyuantong.xcodeproj -scheme Hanyuantong -configuration Release -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG SWIFT_ENABLE_OPAQUE_TYPE_ERASURE=NO CODE_SIGN_IDENTITY=-
                'OTHER_LDFLAGS=$(inherited) $(ACADEMIC_STACK_$(TARGET_NAME))'
                'ACADEMIC_STACK_Hanyuantong=-Wl,-stack_size,0x100000'
                -only-testing:HanyuantongUITests/HonorParityUITests/testCommunityQuickReplyKeepsDraftAndRetriesInPlace)
          xcodebuild "${args[@]}" -resultBundlePath "$RUNNER_TEMP/Academic.xcresult" test
      - name: Collect test results and crashed thread symbols
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Academic.xcresult" || true
          python3 - <<'PY'
          import json, pathlib
          for p in (pathlib.Path.home() / 'Library/Logs/DiagnosticReports').glob('Hanyuantong*.ips'):
              with p.open() as f:
                  f.readline()
                  d=json.load(f)
              print(d.get('exception'),d.get('termination'))
              thread=d['threads'][d.get('faultingThread',0)]
              print([(t.get('symbol'),t.get('imageOffset')) for t in thread.get('frames',[])[:45]])
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reply-comparison-${{ matrix.variant }}
          path: ${{ runner.temp }}/Academic.xcresult
          retention-days: 2
