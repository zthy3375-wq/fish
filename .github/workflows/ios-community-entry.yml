name: iOS community entry regression
on:
  pull_request:
    paths:
      - 'ios-native/Hanyuantong/Views/Treehole*.swift'
      - 'ios-native/Hanyuantong/Views/CommunityHonorCollection.swift'
      - 'ios-native/Hanyuantong/Features/Honors/HonorViews.swift'
      - 'ios-native/Hanyuantong/Services/Treehole*.swift'
      - 'ios-native/Hanyuantong/Views/RootView.swift'
      - 'ios-native/Hanyuantong/HanyuantongApp.swift'
      - 'ios-native/UITests/HonorParityUITests.swift'
      - '.github/workflows/ios-community-entry.yml'
permissions:
  contents: read
concurrency:
  group: ios-community-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  community-entry:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test community entry with a 1 MiB app stack
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list devices available --json | python3 -c '
          import json,re,sys
          rows=json.load(sys.stdin)["devices"]
          versions=[(tuple(map(int, key.split("iOS-")[-1].split("-"))),key) for key,devices in rows.items()
                    if re.search(r"iOS-\d+(?:-\d+)*$",key) and any("iPhone" in d["name"] for d in devices)]
          print(max(versions)[1])')
          device=$(xcrun simctl create "Community Pro Max" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max "$runtime")
          small=$(xcrun simctl create "Community mini" com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          # The first-use system keyboard tutorial can cover the reply editor on a fresh simulator.
          xcrun simctl spawn "$device" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          # Only the app executable gets the phone-sized stack. DEBUG enables our
          # simulator-only fixture transport while Release keeps Swift optimized.
          args=(-project ios-native/Hanyuantong.xcodeproj -scheme Hanyuantong
                -configuration Release
                -derivedDataPath "$RUNNER_TEMP/community-build" -parallel-testing-enabled NO
                SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG SWIFT_ENABLE_OPAQUE_TYPE_ERASURE=NO CODE_SIGN_IDENTITY=-
                'OTHER_LDFLAGS=$(inherited) $(COMMUNITY_STACK_$(TARGET_NAME))'
                'COMMUNITY_STACK_Hanyuantong=-Wl,-stack_size,0x100000'
                )
          entry=(-only-testing:HanyuantongUITests/HonorParityUITests/testCommunityTabAfterExpiredSession
                 -only-testing:HanyuantongUITests/HonorParityUITests/testCommunityTabWithRestoredSession
                 -only-testing:HanyuantongUITests/HonorParityUITests/testCommunityQuickReplyKeepsDraftAndRetriesInPlace)
          layout=(-only-testing:HanyuantongUITests/HonorParityUITests/testCommunityFeedFitsAccessibilityText
                  -only-testing:HanyuantongUITests/HonorParityUITests/testCommunityShelfEquipsAndRemovesLegacyHonor)
          xcodebuild -quiet "${args[@]}" -destination "platform=iOS Simulator,id=$device" build-for-testing
          app="$RUNNER_TEMP/community-build/Build/Products/Release-iphonesimulator/Hanyuantong.app/Hanyuantong"
          xcrun otool -l "$app" | awk '$1 == "stacksize" && $2 == 1048576 { found=1 } END { exit !found }'
          xcodebuild -quiet "${args[@]}" -destination "platform=iOS Simulator,id=$device" \
            -only-testing:HanyuantongTests/TreeholeTests/testPhotoZoomRefitsAndPreservesMagnificationWhenRotated \
            -only-testing:HanyuantongTests/TreeholeTests/testWearableCollectionMatchesAndroidForBothServerVersions \
            -resultBundlePath "$RUNNER_TEMP/CommunityUnits.xcresult" test-without-building
          xcodebuild -quiet "${args[@]}" -destination "platform=iOS Simulator,id=$device" "${entry[@]}" "${layout[@]}" -resultBundlePath "$RUNNER_TEMP/Community.xcresult" test-without-building
          xcrun simctl shutdown "$device"
          xcrun simctl boot "$small"
          xcrun simctl bootstatus "$small" -b
          xcodebuild -quiet "${args[@]}" -destination "platform=iOS Simulator,id=$small" "${layout[@]}" -resultBundlePath "$RUNNER_TEMP/CommunityMini.xcresult" test-without-building
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: community-entry-result
          path: ${{ runner.temp }}/Community*.xcresult
          retention-days: 3
