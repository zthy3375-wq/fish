name: Publish Android 1.3.1 release notes
on:
  pull_request:
    paths: ['.github/workflows/android-131-notes.yml']
permissions:
  contents: read
concurrency:
  group: tencent-candidate-publication
  cancel-in-progress: false
jobs:
  channel:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/android-1.3.1-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cloudbase/tests/updates.verify.mjs
      - name: Confirm only live release notes are being revised
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {catalog,BASE,manifest} from './cloudbase/functions/updates/core.mjs';
          const current=catalog(JSON.parse(readFileSync('cloudbase/functions/updates/releases.json'))).current;
          const {notes,...expected}=manifest(current);
          const response=await fetch(BASE+'/android/stable.json',{signal:AbortSignal.timeout(25000)});
          if(!response.ok)throw Error('Stable channel cannot be verified');
          const {notes:previousNotes,...live}=await response.json();
          assert.deepEqual(live,expected);
          assert.equal(current.versionCode,191);
          assert.equal(current.minSupportedVersionCode,191);
          assert.equal(notes.length,5);
          console.log('Verified release identity, download and mandatory policy');
          JS
      - run: npm install --global @cloudbase/cli@3.9.1 --ignore-scripts
      - name: Deploy notes to the Android update channel
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          TCB_SITE: domestic
          CI: 'true'
        run: node scripts/cloudbase/deploy-updates.mjs
      - name: Read back published notes and check download
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import {catalog,BASE,manifest,publicDownloadUrl} from './cloudbase/functions/updates/core.mjs';
          const expected=manifest(catalog(JSON.parse(readFileSync('cloudbase/functions/updates/releases.json'))).current);
          const headers={'User-Agent':'Hanyuantong/Android (Linux; Android 13)','Cache-Control':'no-cache'};
          const response=await fetch(BASE+'/android/stable.json',{headers,signal:AbortSignal.timeout(25000)});
          assert.equal(response.status,200);
          assert.deepEqual(await response.json(),expected);
          let url=expected.apkUrl,result;
          for(let n=0;n<6;n++){
            result=await fetch(url,{headers,redirect:'manual',signal:AbortSignal.timeout(45000)});
            if(result.status===200)break;
            assert([301,302,303,307,308].includes(result.status));
            url=new URL(result.headers.get('location'),url).href;
            assert(publicDownloadUrl(url));
          }
          assert.equal(result.status,200);
          const bytes=Buffer.from(await result.arrayBuffer());
          assert.equal(bytes.length,expected.sizeBytes);
          assert.equal(createHash('sha256').update(bytes).digest('hex'),expected.sha256);
          console.log('Five detailed notes live in app; original APK hash and forced update verified');
          JS
  pgyer:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/android-1.3.1-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revise the existing version description
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_USER_KEY: ${{ secrets.PGYER_USER_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const key=process.env.PGYER_API_KEY?.trim();
          if(!key)throw Error('Missing provider API key');
          const candidate=JSON.parse(readFileSync('releases/android-candidate.json'));
          const notes=candidate.notes.join('\n');
          async function api(host,path,params){
            try{
              const response=await fetch(host+path,{method:'POST',body:new URLSearchParams({_api_key:key,...params}),redirect:'error',signal:AbortSignal.timeout(22000)});
              if(!response.ok)throw Error('HTTP '+response.status);
              const result=await response.json();
              if(result.code!==0)throw Error('API code '+Number(result.code));
              return result.data;
            }catch(error){
              throw Error(path+' failed: '+(error.message.match(/^(HTTP \d+|API code \d+)$/)?.[0]??'transport error'));
            }
          }
          const v2='https://www.pgyer.com/apiv2/app/';
          const v1='https://api.pgyer.com/apiv1/app/';
          const getCurrent=()=>api(v2,'getByShortcut',{buildShortcutUrl:'hanyuantong'});
          function checkTarget(build){
            if(build.buildKey!==candidate.buildKey||build.buildIdentifier!=='org.handancampus.app'||Number(build.buildVersionNo)!==191||build.buildVersion!=='1.3.1'||Number(build.buildFileSize)!==candidate.sizeBytes)throw Error('Download page identifies a different build');
          }
          const current=await getCurrent();
          checkTarget(current);
          if(current.buildUpdateDescription?.trim()===notes){console.log('The visible version already has the five notes');process.exit(0);}
          let userKey=process.env.PGYER_USER_KEY?.trim()||current.userKey;
          if(!userKey){
            const legacy=await api(v1,'getAppKeyByShortcut',{shortcut:'hanyuantong'});
            if(legacy.appIdentifier!=='org.handancampus.app'||Number(legacy.appVersionNo)!==191||legacy.appVersion!=='1.3.1')throw Error('Account lookup identifies a different build');
            const app=await api(v1,'view',{aKey:legacy.appKey});
            userKey=app.userKey;
          }
          if(typeof userKey!=='string'||!userKey.trim())throw Error('Version editing requires a provider User Key');
          await api(v2,'updateApp',{userKey,buildKey:candidate.buildKey,buildUpdateDescription:notes});
          for(let attempt=0;attempt<4;attempt++){
            const updated=await getCurrent();checkTarget(updated);
            if(updated.buildUpdateDescription?.replace(/\r\n/g,'\n').trim()===notes){
              console.log('Pgyer returned all five notes on the existing Android 1.3.1 build');process.exit(0);
            }
            await new Promise(r=>setTimeout(r,2000));
          }
          throw Error('Provider readback did not return the new notes');
          JS
