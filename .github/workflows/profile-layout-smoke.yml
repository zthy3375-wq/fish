name: Android profile layout verification
on:
  push:
    branches: [qa/profile-overview-test32]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Capture the full profile with earned medals and Chinese fonts
        shell: bash
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL --retry 2 --max-time 50 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o ~/.local/share/fonts/profile-cjk.otf
          fc-cache -f ~/.local/share/fonts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/global-collection-ui.mjs')
          s=p.read_text().replace('chromium.launch()', "chromium.launch({channel:'chrome'})")
          anchor="  await shelf.screenshot("
          assert anchor in s
          s=s.replace(anchor, "  await p.evaluate(()=>document.fonts.ready);await p.waitForTimeout(450);await p.screenshot({path:output+'/profile-with-medals-'+width+'.png',animations:'disabled'});\n"+anchor)
          p.write_text(s)
          PY
          node scripts/global-collection-ui.mjs
      - name: Verify mobile profile, accounts, navigation and settings
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          else
            npx playwright install chromium
          fi
          node scripts/academic-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-phone-check
          path: |
            /tmp/hyt-honors-ui/profile-with-medals-*.png
            /tmp/handan-v050-qa/profile-top-*.png
            /tmp/handan-v050-qa/profile-bottom-*.png
          if-no-files-found: warn
          retention-days: 7
