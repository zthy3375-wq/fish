name: Confirm single verified community developer
on:
  push:
    branches: [ops/confirm-community-owner-20261118]
    paths: ['.github/workflows/confirm-honor-owner.yml','scripts/cloudbase/confirm-honor-owner.mjs']
permissions:
  contents: read
concurrency:
  group: bind-single-community-developer
  cancel-in-progress: false
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm ci --prefix cloudbase/functions/community --ignore-scripts --no-audit --no-fund
      - run: node --test cloudbase/tests/community-honors.verify.mjs
      - name: Match original owner audit, bind and verify projections
        env:
          CLOUDBASE_ENV_ID: hanyuantong-d8gjzt1jh12370215
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: node scripts/cloudbase/confirm-honor-owner.mjs
