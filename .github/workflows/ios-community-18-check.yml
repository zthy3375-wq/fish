name: Community entry on iOS 18
on:
  push:
    branches: [qa/ios-community-18-20261122]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: baseline
            source: ec2384ecc5eb72898ee6a6e658983ddc186e0475
          - version: candidate
            source: f09fd9b95b6b88345c3f45f42c668d3c787f750c
    name: iOS 18 - ${{ matrix.version }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Open the community tab on a release-optimized app
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.0.app || ls -d /Applications/Xcode_26*.app
          target=$(ls -d /Applications/Xcode_26*.app | head -1)
          export DEVELOPER_DIR="$target/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for k,ds in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if "iOS-18-" in k for d in ds if "iPhone" in d["name"]))')
          python3 - <<'PYBUILD'
          from pathlib import Path
          p = Path("ios-native/Hanyuantong.xcodeproj/project.pbxproj")
          s = p.read_text()
          old = '"OTHER_LDFLAGS" = ( "$(inherited)", "-lz" );'
          assert s.count(old) == 2
          p.write_text(s.replace(old, '"OTHER_LDFLAGS" = ( "$(inherited)", "-lz", "-Wl,-stack_size,0x100000" );'))
          PYBUILD
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild -quiet -project ios-native/Hanyuantong.xcodeproj -scheme Hanyuantong -configuration Release -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG SWIFT_ENABLE_OPAQUE_TYPE_ERASURE=NO CODE_SIGN_IDENTITY=- IPHONEOS_DEPLOYMENT_TARGET=18.4 -resultBundlePath "$RUNNER_TEMP/Community.xcresult" -only-testing:HanyuantongUITests/HonorParityUITests/testCommunityTabAfterExpiredSession -only-testing:HanyuantongUITests/HonorParityUITests/testCommunityTabWithRestoredSession test
      - name: Show simulator crash backtraces
        if: failure()
        run: |
          find "$HOME/Library/Logs/DiagnosticReports" -name 'Hanyuantong*.ips' -exec python3 -c 'import sys,json; f=open(sys.argv[1]); f.readline(); d=json.load(f); print(d.get("exception"),d.get("termination")); t=d["threads"][d.get("faultingThread",0)]; print([(x.get("symbol"),x.get("imageOffset")) for x in t.get("frames",[])[:55]])' {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-ios18-${{ matrix.version }}
          path: ${{ runner.temp }}/Community.xcresult
          retention-days: 3
