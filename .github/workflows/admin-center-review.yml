name: Admin center review (no deployment)
on:
  push:
    branches: [feat/community-admin-center-20261117]
    paths: ['src/**', 'scripts/**', 'tests/**', 'cloudbase/**', 'package*.json', '.github/workflows/admin-center-review.yml']
permissions:
  contents: read
concurrency:
  group: admin-center-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        snapshot: [before, after]
    env:
      ADMIN_BASELINE: ${{ matrix.snapshot == 'before' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact test18 UI baseline, same isolated backend and fixtures
        if: matrix.snapshot == 'before'
        run: git restore --source 4b8a326022a7a5b7d20ff0407dbc4b6de0047bb1 -- src public tests package.json package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix cloudbase/functions/community --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - run: node scripts/admin-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-center-${{ matrix.snapshot }}
          path: /tmp/handan-admin-center-qa
          retention-days: 14
