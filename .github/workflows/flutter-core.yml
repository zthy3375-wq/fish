name: Flutter core verification
on:
  push:
    branches: ['migration/flutter-core-phase1']
    paths: ['flutter_app/**', '.github/workflows/flutter-core.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned official Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: npm ci
      - run: node --test flutter_app/test_js/adapter.test.mjs
      - run: flutter pub get
        working-directory: flutter_app
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: flutter_app
      - run: flutter analyze
        working-directory: flutter_app
      - run: flutter test
        working-directory: flutter_app
      - run: flutter build apk --debug
        working-directory: flutter_app
      - name: Verify independent application ID
        run: |
          apk=flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          tool=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$tool" dump badging "$apk" | head -1 | tee flutter_app/build/apk-package.txt
          grep "name='org.handancampus.fluttercore'" flutter_app/build/apk-package.txt
          sha256sum "$apk" > flutter_app/build/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hanyuantong-flutter-core-android-${{ github.sha }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-debug.apk
            flutter_app/build/apk-package.txt
            flutter_app/build/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter build ios --simulator --debug
        working-directory: flutter_app
      - name: Archive simulator build (not a signed device IPA)
        run: ditto -c -k --sequesterRsrc --keepParent flutter_app/build/ios/iphonesimulator/Runner.app flutter_app/build/hanyuantong-core-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hanyuantong-flutter-core-ios-simulator-${{ github.sha }}
          path: flutter_app/build/hanyuantong-core-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
