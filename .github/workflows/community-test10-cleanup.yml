name: Verify test10 disposable media cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix cloudbase/functions/community --ignore-scripts --no-audit --no-fund
      - run: node scripts/cloudbase/verify-test10-cleanup.mjs
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
