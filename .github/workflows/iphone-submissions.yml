name: Read submitted iPhone crash signatures
on:
  push:
    branches: [qa/iphone-crash-feedback-20261123]
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7ff29605212161a701cb8503afe9e6753ee44dba
          persist-credentials: false
      - name: Check current build and sanitized crash signatures
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import collections, os, re, sys, tempfile
          sys.path.insert(0, ".github/scripts")
          from testflight_rollout import BUNDLE_ID, api, ios_builds, find_build, AppleError
          signatures = ["EXC_BAD_ACCESS", "SIGSEGV", "SIGABRT", "SIGTRAP", "stack overflow", "Stack Guard", "AttributeGraph", "TreeholeView", "TreeholeEnvelope", "TreeholeService", "AcademicSession", "SchoolCourseAdjustments", "CampusStore", "AcademicRecordsView", "SwiftUI", "WKWebView", "UIHostingController", "WKContentRuleListStore", "UIApplicationInvalidInterfaceOrientation", "CALayerInvalidGeometry", "NSInvalidArgumentException", "NSInternalInconsistencyException", "WTF::", "WKContentView", "dispatch_assert_queue_fail", "swift_task_checkIsolated", "ScrollViewProxy", "swift_getTypeByMangledName", "swift_getAssociatedTypeWitness", "assertionFailure", "swift_beginAccess", "Dictionary", "UIGraphics", "ImageIO", "EXC_RESOURCE", "Terminated due to memory"]
          with tempfile.NamedTemporaryFile() as key:
              key.write(os.environ.pop("ASC_PRIVATE_KEY").strip().replace("\\n", "\n").encode())
              key.flush()
              os.environ["ASC_KEY_PATH"] = key.name
              apps = api("apps", {"filter[bundleId]": BUNDLE_ID, "fields[apps]": "bundleId"})["data"]
              assert len(apps) == 1 and apps[0]["attributes"]["bundleId"] == BUNDLE_ID
              build = max(ios_builds(apps[0]["id"]), key=lambda x:x["attributes"]["uploadedDate"])
              print("Current build:",build["attributes"]["version"])
              recent=sorted(ios_builds(apps[0]["id"]),key=lambda x:x["attributes"]["uploadedDate"],reverse=True)[:3]
              for b in recent:
                  try:
                      pages=api("builds/"+b["id"]+"/metrics/betaBuildUsages").get("data",[])
                      for g in pages:
                          for point in g.get("dataPoints",[])[:8]:
                              print("Build metrics:",b["attributes"]["version"],point.get("start","")[:10],point.get("end","")[:10],{k:point.get("values",{}).get(k) for k in ["crashCount","sessionCount","installCount"]})
                      if not pages: print("Metrics unavailable:",b["attributes"]["version"])
                  except AppleError as err: print("Build metrics status:",err.status, str(err).partition("(")[2][:140])
              assert build is not None
              endpoint = "apps/" + apps[0]["id"] + "/betaFeedbackCrashSubmissions"
              page = api(endpoint, {"fields[betaFeedbackCrashSubmissions]":"build", "include":"build", "fields[builds]":"version", "limit":100})
              rows = [r for r in page["data"] if (r["relationships"].get("build",{}).get("data") or {}).get("id") == build["id"]]
              print("Latest matching submissions:", len(rows))
              for row in rows[:10]:
                  try:
                      info = api("betaFeedbackCrashSubmissions/"+row["id"]+"/crashLog")["data"]["attributes"]
                  except AppleError as error:
                      print("Crash log read status:",error.status)
                      continue
                  raw = str(info).lower()
                  import json, pathlib
                  names=set()
                  for source in pathlib.Path("ios-native/Hanyuantong").rglob("*.swift"):
                      names.update(re.findall(r"\b(?:struct|class|enum) (\w{7,})",source.read_text()))
                  print("Matched product types:", sorted(n for n in names if n.lower() in raw)[:60])
                  report = info.get("logText") or ""
                  if isinstance(report,str):
                      try:
                          payload=json.loads(report[report.find("\n")+1:]) if report.count("\n") and '"incident_id"' in report.split("\n")[0] else json.loads(report)
                          appsidx=[i for i,x in enumerate(payload.get("usedImages",[])) if x.get("name")=="Hanyuantong"]
                          for i in appsidx: print("App image UUID:",str(payload["usedImages"][i].get("uuid",""))[:36])
                          threads=payload.get("threads",[])
                          thread=next((t for t in threads if t.get("triggered")),None)
                          if thread: print("App frame offsets:",[x.get("imageOffset") for x in thread["frames"] if x.get("imageIndex") in appsidx and isinstance(x.get("imageOffset"),int)][:24])
                      except (ValueError,KeyError,TypeError): pass
                  print("Recognized crash markers:", [s for s in signatures if s.lower() in raw])
          PY
