name: Community honor gallery verification
on:
  pull_request:
    paths:
      - 'src/components/honors/**'
      - 'src/domain/communityHonors.ts'
      - 'cloudbase/tests/community-honors.verify.mjs'
      - 'scripts/community-honors-ui.mjs'
      - 'scripts/community-collection-ui.mjs'
      - 'cloudbase/tests/community-honor-collection.verify.mjs'
      - '.github/workflows/community-honors-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm ci --prefix cloudbase/functions/community --ignore-scripts
      - run: bash scripts/install-ui-fonts.sh
      - run: npx playwright install chromium
      - name: Build previous profile and capture the same three viewport widths
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || '919e02ce276c60b67528e9c90c795fc64e58ff55' }}
        run: |
          # main at 1.2.4 predates the community profile. Use the previous Android
          # build for the before image when the PR base has no profile to capture.
          if ! git cat-file -e "$BASELINE:src/components/Treehole.vue"; then
            BASELINE=6c167f8391f882bf3a1add43433aa16f369ac9f8
          fi
          git worktree add --detach "$RUNNER_TEMP/hyt-before" "$BASELINE"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/hyt-before/node_modules"
          npm --prefix "$RUNNER_TEMP/hyt-before" run build
          HYT_UI_DIST="$RUNNER_TEMP/hyt-before/dist" HYT_HONORS_ONLY=before node scripts/treehole-browser-check.mjs
      - name: Collect revised profile, badge, cabinet and notification
        run: npm run build && HYT_HONORS_ONLY=after node scripts/treehole-browser-check.mjs
      - name: Verify community collection, archive and management
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || 'af322d2d40ffb6b4e8f48c22f66f61a915fe4d1e' }}
        run: |
          git show "$BASELINE:cloudbase/community-schema.sql" > "$RUNNER_TEMP/community-prior.sql"
          HYT_COLLECTION_PREVIOUS_SCHEMA="$RUNNER_TEMP/community-prior.sql" node --test cloudbase/tests/community-honor-collection.verify.mjs
          HYT_COLLECTION_UI=1 node scripts/treehole-browser-check.mjs
      - run: node scripts/global-collection-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-honors-mobile
          path: |
            /tmp/hyt-honors-ui/
            /tmp/hyt-community-collection/
          if-no-files-found: warn
