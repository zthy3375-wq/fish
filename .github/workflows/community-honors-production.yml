name: Activate community achievements
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/community-honors-production.yml', 'cloudbase/**', 'scripts/cloudbase/**']
permissions:
  contents: read
concurrency:
  group: community-authorized-deployment
  cancel-in-progress: false
jobs:
  activation:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'deploy/community-achievements-20261120' && github.base_ref == 'deploy/community-honors-members-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIVE_BASE: d4f996fc3350ccb9002cc2a46c7ab89f1f930e6d
      HYT_COLLECTION_PREVIOUS_SCHEMA: /tmp/hyt-honors-live-before.sql
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check the reviewed source baseline
        run: |
          git merge-base --is-ancestor "$LIVE_BASE" HEAD
          git show "$LIVE_BASE:cloudbase/community-schema.sql" > "$HYT_COLLECTION_PREVIOUS_SCHEMA"
          git show "$LIVE_BASE:cloudbase/functions/community/core.mjs" > /tmp/hyt-honors-live-before-core.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check:community
      - name: Install CloudBase control-plane dependencies
        run: python3 -m pip install tencentcloud-sdk-python cryptography
      - name: Back up the current function and verify deployment scope
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          python3 scripts/cloudbase/contest-service.py backup
          python3 scripts/cloudbase/contest-service.py prepare-honors
      - name: Activate and verify the community APIs
        id: activation
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          node scripts/cloudbase/deploy-community-honors.mjs migrate
          python3 scripts/cloudbase/contest-service.py publish-honors-code
          node scripts/cloudbase/deploy-community-honors.mjs verify
      - name: Restore the previous function code if activation fails
        if: failure() && steps.activation.outcome == 'failure'
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: python3 scripts/cloudbase/contest-service.py restore-honors-code
      - name: Keep the encrypted rollback artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-honors-code-rollback
          path: artifacts/community-rollback.enc
          retention-days: 7
          if-no-files-found: ignore
